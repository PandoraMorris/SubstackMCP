<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px -apple-system, system-ui, sans-serif;
        width: 290px;
        padding: 16px;
        margin: 0;
        color: #111;
        background: #fff;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      button {
        font-size: 14px;
        padding: 9px 12px;
        width: 100%;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #333;
        background: #111;
        color: #fff;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #msg { margin-top: 12px; white-space: pre-wrap; line-height: 1.35; }
      code { background: #eee; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Substack Key Grabber</h1>
    <button id="go">Grab my Substack key</button>
    <div id="msg">
      Click when Terminal says <b>Ready</b>. (It says that during setup, or after you run <code>npm run grab:ext</code>.)
    </div>
    <script src="popup.js"></script>
  </body>
</html>
